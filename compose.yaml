services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readlogic}
      POSTGRES_USER: ${POSTGRES_USER:-readlogic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readlogic-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-readlogic}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-readlogic-local-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr-service:
    build:
      context: ./ocr-service
    environment:
      OCR_SERVICE_MAX_CONCURRENCY: ${OCR_CONCURRENCY:-1}
      OCR_SERVICE_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-40000000}
      OCR_SERVICE_MAX_IMAGE_SIZE_BYTES: ${MAX_IMAGE_SIZE_BYTES:-10485760}
    expose:
      - "8000"
    volumes:
      - ocr-model-cache:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-readlogic}
      DB_USERNAME: ${POSTGRES_USER:-readlogic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-readlogic-local-password}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-readlogic}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-readlogic-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-readlogic-pages}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-100MB}
      MAX_IMAGE_SIZE_BYTES: ${MAX_IMAGE_SIZE_BYTES:-10485760}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr-service:8000}
      OCR_CONNECT_TIMEOUT: ${OCR_CONNECT_TIMEOUT:-5s}
      OCR_READ_TIMEOUT: ${OCR_READ_TIMEOUT:-120s}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-3}
      OCR_POLL_INTERVAL: ${OCR_POLL_INTERVAL:-2s}
      OCR_STALE_AFTER: ${OCR_STALE_AFTER:-5m}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
      OCR_BATCH_SIZE: ${OCR_BATCH_SIZE:-5}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  ocr-model-cache:
