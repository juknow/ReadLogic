name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: backend/*.gradle*

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Test and build executable jar
        run: ./gradlew test bootJar
