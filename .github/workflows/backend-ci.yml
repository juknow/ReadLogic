name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'ocr-service/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - 'ocr-service/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: backend/*.gradle*

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Test and build executable jar
        run: ./gradlew test bootJar

  ocr-quality:
    name: OCR test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ocr-service/uv.lock

      - name: Install Korean test font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        working-directory: ocr-service
        run: uv sync --frozen

      - name: Check formatting and types
        working-directory: ocr-service
        run: uv run ruff check . && uv run mypy src

      - name: Run OCR tests
        working-directory: ocr-service
        env:
          OCR_TEST_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          RUN_OCR_MODEL_TESTS: '1'
        run: uv run pytest

      - name: Build OCR image
        run: docker build --tag readlogic-ocr-service ./ocr-service
