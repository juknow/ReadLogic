spring:
  datasource:
    url: jdbc:h2:mem:readlogic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  upload:
    max-image-size-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: test-access-key
      secret-key: test-secret-key
      bucket: readlogic-test-pages
  ocr:
    enabled: false
    base-url: http://localhost:8000
    connect-timeout: 100ms
    read-timeout: 100ms
    max-attempts: 3
    poll-interval: 2s
    stale-after: 5m
    concurrency: 1
    batch-size: 5
