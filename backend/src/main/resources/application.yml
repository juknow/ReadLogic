spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readlogic}
    username: ${DB_USERNAME:readlogic}
    password: ${DB_PASSWORD:readlogic-local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    max-image-size-bytes: ${MAX_IMAGE_SIZE_BYTES:10485760}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:readlogic}
      secret-key: ${MINIO_SECRET_KEY:readlogic-local-password}
      bucket: ${MINIO_BUCKET:readlogic-pages}
  ocr:
    enabled: ${OCR_ENABLED:true}
    base-url: ${OCR_BASE_URL:http://localhost:8000}
    connect-timeout: ${OCR_CONNECT_TIMEOUT:5s}
    read-timeout: ${OCR_READ_TIMEOUT:120s}
    max-attempts: ${OCR_MAX_ATTEMPTS:3}
    poll-interval: ${OCR_POLL_INTERVAL:2s}
    stale-after: ${OCR_STALE_AFTER:5m}
    concurrency: ${OCR_CONCURRENCY:1}
    batch-size: ${OCR_BATCH_SIZE:5}
