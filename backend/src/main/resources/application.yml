spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readlogic}
    username: ${DB_USERNAME:readlogic}
    password: ${DB_PASSWORD:readlogic-local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

