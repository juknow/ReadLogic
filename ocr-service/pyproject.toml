[project]
name = "readlogic-ocr-service"
version = "0.1.0"
description = "Internal Korean page OCR service for ReadLogic"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "paddleocr==3.3.2",
    "paddlepaddle==3.2.0",
    "pillow>=11,<13",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
markers = ["model: runs the real PaddleOCR model and may download model files"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["readlogic_ocr"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "paddleocr", "paddleocr.*"]
ignore_missing_imports = true
